# shellcheck shell=bash disable=SC2034
# MYGAME port settings. This file is read by the launch script (it is plain shell: NAME="value").
# To reset a setting, delete its line or copy the file again from the port zip.
# Lines starting with # are comments. Options marked "needs shell patch" only do something when
# the patched game shell reads the flashvar of that name.

# ---------------------------------------------------------------------------------------------
# Game and display
# ---------------------------------------------------------------------------------------------

# Ruffle render quality: low (fastest, no anti aliasing), medium, high
QUALITY="low"

# How the game fills the screen (needs shell patch, flashvar "aspect"):
#   fit    = the original picture centred, black bars where the screen differs
#   fill   = the original picture scaled to cover the screen, the overflow is cut off
#   extend = the game lays out more of its scene to fit the screen shape (best when supported)
ASPECT="fit"

# Game frame rate (needs shell patch, flashvar "fps"). 30 keeps the speed steady on handhelds,
# 60 is smoother but only for devices that can hold a full 60 fps.
FRAME_RATE="30"

# Draw the game at a smaller size and scale it up, as WIDTHxHEIGHT, for example "640x480".
# Cuts the work of weak GPUs at the price of sharpness. Empty means the full screen size.
RENDER_SIZE=""

# ---------------------------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------------------------

# A key release that comes sooner than this many milliseconds after its key press is held back
# until the time is up. Games that poll keys once per frame (Flash AS2 Key.isDown) miss the very
# short taps gptokeyb sends for buttons like Start. 0 turns it off. Raise to 150 for games that
# run at 20 fps. (RUFFLE_MIN_KEY_HOLD_MS)
export RUFFLE_MIN_KEY_HOLD_MS=100

# ---------------------------------------------------------------------------------------------
# Memory (garbage collection and trimming). Defaults suit a 1 GB handheld.
# ---------------------------------------------------------------------------------------------

# Extra garbage collection work per frame, as a fraction of a full collection (0 turns it off).
# Raise when memory (RSS) keeps creeping up in buffer heavy games, set 0 if the profile shows
# the collector taking a visible share of each frame. (RUFFLE_GC_STEP)
export RUFFLE_GC_STEP=0.01

# Seconds between returning freed memory to the system with malloc_trim. 0 never trims,
# lower trims more often (tighter memory, small stalls). (RUFFLE_TRIM_SECS)
export RUFFLE_TRIM_SECS=2

# A frame that takes longer than this many seconds (a level load) triggers a full collection and a
# trim right after it. 0 turns it off. Lower it for games whose loads take 0.5 to 1 s.
# (RUFFLE_GC_LONG_TICK)
export RUFFLE_GC_LONG_TICK=1.0

# ---------------------------------------------------------------------------------------------
# Advanced switches. Defaults are right for most games, change one only to compare or to rule a
# feature out while chasing a bug. Remove the leading # to apply. Per level values belong in
# tools/run-ruffle.env instead.
# ---------------------------------------------------------------------------------------------

# Find the clip under the mouse only when the mouse moves, instead of every frame. Big AVM1 levels
# and games played with a gamepad. (RUFFLE_LAZY_MOUSE_PICK, off by default)
#export RUFFLE_LAZY_MOUSE_PICK=1

# Run two game frames per screen update when a frame is slow, so frame locked games keep their
# speed. (RUFFLE_FRAMESKIP, off by default)
#export RUFFLE_FRAMESKIP=1

# Tessellate shapes at the first draw instead of at load (saves memory). 0 for eager loading:
# first drawing hitches less, memory grows. (RUFFLE_LAZY_SHAPES, default on)
#export RUFFLE_LAZY_SHAPES=0

# Drop parsed shape records and parse them again when needed. 0 rules out reparse bugs.
# (RUFFLE_LAZY_SHAPE_RECORDS, default on)
#export RUFFLE_LAZY_SHAPE_RECORDS=0

# BitmapData.draw straight into the target texture when it is safe. 0 rules out rendering
# differences. (RUFFLE_DRAW_IN_PLACE, default on)
#export RUFFLE_DRAW_IN_PLACE=0

# Megabytes of pooled offscreen draws before the pool is submitted and emptied. Lower on tight
# memory, higher if the extra submits cost frame rate. 0 turns it off. (RUFFLE_DRAW_POOL_MB,
# default 16)
#export RUFFLE_DRAW_POOL_MB=16

# Zero filled bitmap pixels from calloc, and GPU side zero init for blank bitmaps. 0 to compare.
# (RUFFLE_ZEROED_PIXELS and RUFFLE_EMPTY_TEXTURES, default on)
#export RUFFLE_ZEROED_PIXELS=0
#export RUFFLE_EMPTY_TEXTURES=0

# Stage3D games: queue texture uploads instead of submitting twice, and merge consecutive
# drawTriangles into one pass. 0 to compare or to rule out ordering bugs.
# (RUFFLE_S3D_DEFER_UPLOAD and RUFFLE_S3D_MERGE_PASSES, default on)
#export RUFFLE_S3D_DEFER_UPLOAD=0
#export RUFFLE_S3D_MERGE_PASSES=0

# ---------------------------------------------------------------------------------------------
# Logging for testing. Set VERBOSE_LOGS=0 in the release build.
# ---------------------------------------------------------------------------------------------

# 1 = test build: the launcher prints the device, firmware, glibc, memory, swap and zram state
#     and the exact command, keeps the last log as log.prev.txt next to log.txt, and the switches
#     below record frame rate, timing, memory and slow script methods.
# 0 = release: only what ruffle_sdl itself prints (warnings and errors).
VERBOSE_LOGS=1

if [ "$VERBOSE_LOGS" = 1 ]; then
  # Log filter. ruffle_sdl at debug level shows the window, GL and event loop details, memlog
  # the memory accounting, pmgpu the GPU counters, port_fps the frame rate lines.
  export RUST_LOG="warn,ruffle_sdl=debug,memlog=info,pmgpu=info,ruffle_core::player::port_fps=info"
  # Every 2 s: game frames per second, milliseconds per game tick and per render. Any value turns
  # it on, even 0. Needs the port_fps entry in RUST_LOG above. (RUFFLE_FPS_LOG)
  export RUFFLE_FPS_LOG=1
  # Every 2 s: share of the frame spent in the game tick, in rendering and in swapping buffers.
  # Tells a CPU bound game from a GPU bound one. Any value turns it on. (RUFFLE_SDL_TIMING)
  export RUFFLE_SDL_TIMING=1
  # Memory accounting by category (bitmaps, textures, shapes, sounds, SWF data) and an RSS sampler.
  # Use when chasing out of memory kills. (RUFFLE_MEMLOG)
  export RUFFLE_MEMLOG=1
  # RSS sample period in milliseconds (RUFFLE_MEMLOG_MS) and the number of largest items listed
  # per category at each new memory peak (RUFFLE_MEMLOG_TOP).
  export RUFFLE_MEMLOG_MS=500
  export RUFFLE_MEMLOG_TOP=8
  # File that receives the peak dumps. Without it they only go to the log.
  # (RUFFLE_MEMLOG_PEAK; $GAMEDIR is set by the launcher before this file is read)
  export RUFFLE_MEMLOG_PEAK="$GAMEDIR/memlog-peak.txt"
  # Every 5 s: the hottest ActionScript 3 methods, to find game code worth patching.
  # Any value turns it on. (RUFFLE_AS3_PROF)
  export RUFFLE_AS3_PROF=1
  # Every 2 s: GPU submits, render passes and draw calls (log target pmgpu). Any value turns it
  # on. (PM_GPUSTAT)
  export PM_GPUSTAT=1
fi
